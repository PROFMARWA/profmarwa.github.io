<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>المناعة | علوم الطبيعة والحياة</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;

    background:
        radial-gradient(circle at top, #651080 0%, #35054d 45%, #160021 100%);

    color: white;
    min-height: 100vh;
}


/* =========================
   العنوان
========================= */

header {
    text-align: center;
    padding: 30px 15px 20px;
}

header h1 {
    margin: 0;

    font-size: 32px;

    color: #8fffd0;

    text-shadow:
        0 0 10px rgba(143,255,208,0.45);
}

header p {
    margin-top: 10px;

    color: #eee;

    font-size: 15px;
}


/* =========================
   البطاقات
========================= */

.sections {

    width: 95%;

    max-width: 900px;

    margin: 10px auto 35px;

    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 18px;
}


/* البطاقة */

.immunity-card {

    position: relative;

    min-height: 290px;

    padding: 35px 20px 25px;

    border-radius: 25px;

    text-decoration: none;

    color: white;

    text-align: center;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    overflow: hidden;

    background:
        linear-gradient(
            145deg,
            rgba(121,20,145,0.95),
            rgba(50,5,76,0.98)
        );

    border: 3px solid #18d58d;

    box-shadow:
        0 0 8px rgba(24,213,141,0.75),
        inset 0 0 25px rgba(255,40,180,0.08);

    transition: 0.25s ease;
}


/* الخط العلوي */

.immunity-card::before {

    content: "";

    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    height: 6px;

    background:
        linear-gradient(
            90deg,
            #ff19a8,
            #b52cff,
            #45e5b0
        );

    box-shadow:
        0 0 10px rgba(255,25,168,0.8);
}


/* تأثير عند الضغط */

.immunity-card:active {

    transform: scale(0.97);
}


/* =========================
   مربع الأيقونة
========================= */

.card-icon {

    width: 88px;
    height: 88px;

    border-radius: 25px;

    display: flex;

    align-items: center;
    justify-content: center;

    margin-bottom: 22px;

    font-size: 42px;

    background:
        linear-gradient(
            135deg,
            #ff239f,
            #8e32e8,
            #35e5a0
        );

    box-shadow:
        0 0 20px rgba(255,40,180,0.3);

}


/* =========================
   عنوان البطاقة
========================= */

.immunity-card h2 {

    margin: 0 0 12px;

    font-size: 22px;

    line-height: 1.4;

    background:
        linear-gradient(
            90deg,
            #72ffd1,
            #ff8bd3
        );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}


/* =========================
   الوصف
========================= */

.immunity-card p {

    margin: 0;

    color: #fff;

    font-size: 14px;

    line-height: 1.8;

    max-width: 260px;
}


/* =========================
   زر العودة
========================= */

.back-button {

    display: block;

    width: fit-content;

    margin: 5px auto 35px;

    padding: 11px 22px;

    border-radius: 25px;

    text-decoration: none;

    color: white;

    font-weight: bold;

    background:
        linear-gradient(
            90deg,
            #8e21e8,
            #ff35ad
        );

    box-shadow:
        0 0 15px rgba(255,53,173,0.25);
}


/* =========================
   الهاتف
========================= */

@media (max-width: 600px) {

    header {
        padding-top: 25px;
    }

    header h1 {
        font-size: 28px;
    }

    .sections {

        width: 96%;

        gap: 14px;
    }

    .immunity-card {

        min-height: 275px;

        padding: 30px 12px 20px;
    }

    .card-icon {

        width: 75px;
        height: 75px;

        font-size: 36px;

        border-radius: 22px;
    }

    .immunity-card h2 {

        font-size: 18px;
    }

    .immunity-card p {

        font-size: 13px;
    }

}

</style>

</head>


<body>


<header>

    <h1>المناعة</h1>

    <p>
        اختر المحور الذي تريد دراسته
    </p>

</header>


<section class="sections">


    <!-- الذات واللاذات -->

    <a href="#" class="immunity-card">

        <div class="card-icon">
            🧬
        </div>

        <h2>
            الذات واللاذات
        </h2>

        <p>
            مفهوم الذات واللاذات والتعرف على العناصر الغريبة
        </p>

    </a>


    <!-- المناعة الخلطية والخلوية -->

    <a href="#" class="immunity-card">

        <div class="card-icon">
            🛡️
        </div>

        <h2>
            المناعة الخلطية والخلوية
        </h2>

        <p>
            آليات الاستجابة المناعية الخلطية والخلوية
        </p>

    </a>


</section>


<a href="science.html" class="back-button">
    ← العودة إلى علوم الطبيعة والحياة
</a>


</body>

</html>
