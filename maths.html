<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>شعبة الرياضيات | Science with Prof Marwa</title>

<style>

/* =====================================================
   صفحة شعبة الرياضيات
   نفس هوية صفحة العلوم
   ===================================================== */

.math-page {
    min-height: 100vh;

    padding: 45px 5% 60px;

    background:
        radial-gradient(
            circle at 10% 10%,
            rgba(255,105,190,0.22),
            transparent 30%
        ),

        radial-gradient(
            circle at 90% 90%,
            rgba(100,240,170,0.20),
            transparent 30%
        ),

        linear-gradient(
            135deg,
            #fff5fc,
            #fffaff,
            #f4fff9
        );

    color: #54206d;
}


/* =====================================================
   العنوان
   ===================================================== */

.math-header {
    text-align: center;

    margin-bottom: 38px;
}

.math-header h1 {

    margin: 0;

    font-size: clamp(32px, 6vw, 54px);

    font-weight: 900;

    background:
        linear-gradient(
            90deg,
            #ec3fae,
            #a94bd2,
            #35c98a
        );

    -webkit-background-clip: text;

    -webkit-text-fill-color: transparent;
}

.math-header p {

    margin-top: 12px;

    color: #76567d;

    font-size: 19px;

    font-weight: bold;
}


/* =====================================================
   شبكة المربعات
   ===================================================== */

.math-grid {

    width: 100%;

    max-width: 1150px;

    margin: auto;

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 22px;
}


/* =====================================================
   المربع
   ===================================================== */

.math-card {

    position: relative;

    min-height: 190px;

    padding: 25px 18px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    text-decoration: none;

    background:
        linear-gradient(
            145deg,
            rgba(255,255,255,0.98),
            rgba(255,244,252,0.94)
        );

    border: 3px solid #38c982;

    border-radius: 26px;

    box-shadow:
        0 10px 30px
        rgba(84,32,109,0.14),

        0 0 12px
        rgba(56,201,130,0.18);

    overflow: hidden;

    transition:
        transform .35s ease,
        box-shadow .35s ease;
}


/* الحافة العلوية */

.math-card::before {

    content: "";

    position: absolute;

    top: 0;

    left: 0;

    width: 100%;

    height: 6px;

    background:
        linear-gradient(
            90deg,
            #35c98a,
            #ff42b5,
            #8b45d0,
            #35c98a
        );
}


/* لمعة داخلية */

.math-card::after {

    content: "";

    position: absolute;

    inset: 0;

    background:
        radial-gradient(
            circle at 50% 0%,
            rgba(255,80,190,0.10),
            transparent 45%
        );

    pointer-events: none;
}


.math-card:hover {

    transform:
        translateY(-8px)
        scale(1.01);

    box-shadow:
        0 20px 42px
        rgba(235,55,170,0.20),

        0 0 20px
        rgba(53,201,138,0.25);
}


/* =====================================================
   الأيقونة
   ===================================================== */

.math-icon {

    position: relative;

    z-index: 2;

    width: 72px;

    height: 72px;

    margin-bottom: 15px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 22px;

    color: white;

    font-size: 34px;

    background:
        linear-gradient(
            135deg,
            #ff3fae,
            #a94bd2,
            #35c98a
        );

    box-shadow:
        0 8px 20px
        rgba(255,60,175,.25);

    transition:
        transform .35s ease;
}


.math-card:hover .math-icon {

    transform:
        rotate(-5deg)
        scale(1.08);
}


/* =====================================================
   النص
   ===================================================== */

.math-card h2 {

    position: relative;

    z-index: 2;

    margin:
        0 0 9px;

    font-size: 22px;

    font-weight: 900;

    line-height: 1.
