<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>المناعة</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;

    background:
        radial-gradient(circle at top, #651080 0%, #35054d 45%, #160021 100%);

    color: white;
    min-height: 100vh;
}


/* العنوان */

header {
    text-align: center;
    padding: 35px 15px 25px;
}

header h1 {
    margin: 0;

    font-size: 30px;

    color: #8fffd0;

    text-shadow: 0 0 12px rgba(143,255,208,0.5);
}

header p {
    margin-top: 10px;

    color: #eee;

    font-size: 15px;
}


/* الخانات */

.sections {

    width: 95%;
    max-width: 900px;

    margin: 10px auto 35px;

    display: grid;

    grid-template-columns: repeat(2, 1fr);

    gap: 18px;
}


/* البطاقة */

.section-card {

    position: relative;

    min-height: 280px;

    padding: 30px 15px;

    border-radius: 25px;

    text-decoration: none;

    color: white;

    text-align: center;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    overflow: hidden;

    background:
        linear-gradient(
            145deg,
            rgba(121,20,145,0.95),
            rgba(50,5,76,0.98)
        );

    border: 3px solid #18d58d;

    box-shadow:
        0 0 8px rgba(24,213,141,0.75),
        inset 0 0 25px rgba(255,40,180,0.08);

    transition: 0.25s ease;
}


/* الخط العلوي */

.section-card::before {

    content: "";

    position: absolute;

    top: 0;
    left: 0;
    right: 0;

    height: 6px;

    background:
        linear-gradient(
            90deg,
            #ff19a8,
            #b52cff,
            #45e5b0
        );

    box-shadow:
        0 0 10px rgba(255,25,168,0.8);
}


/* عند الضغط */

.section-card:active {
    transform: scale(0.97);
}


/* الأيقونة */

.section-icon {

    width: 85px;
    height: 85px;

    border-radius: 24px;

    display: flex;

    align-items: center;
    justify-content: center;

    margin-bottom: 20px;

    font-size: 40px;

    background:
        linear-gradient(
            135deg,
            #ff239f,
            #8e32e8,
            #35e5a0
        );

    box-shadow:
        0 0 20px rgba(255,40,180,0.3);
}


/* العنوان */

.section-card h2 {

    margin: 0 0 12px;

    font-size: 21px;

    background:
        linear-gradient(
            90deg,
            #72ffd1,
            #ff8bd3
        );

    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}


/* الوصف */

.section-card p {

    margin: 0;

    color: white;

    font-size: 14px;

    line-height: 1.8;
}


/* العودة */

.back-button {

    display: block;

    width: fit-content;

    margin: 5px auto 35px;

    padding: 11px 22px;

    border-radius: 25px;

    text-decoration: none;

    color: white;

    font-weight: bold;

    background:
        linear-gradient(
            90deg,
            #8e21e8,
            #ff35ad
        );

    box-shadow:
        0 0 15px rgba(255,53,173,0.25);
}


/* الهاتف */

@media (max-width: 600px) {

    header h1 {
        font-size: 27px;
    }

    .sections {

        width: 96%;

        gap: 14px;
    }

    .section-card {

        min-height: 260px;

        padding: 25px 10px;
    }

    .section-icon {

        width: 75px;
        height: 75px;

        font-size: 35px;
    }

    .section-card h2 {
        font-size: 18px;
    }

    .section-card p {
        font-size: 13px;
    }

}

</style>

</head>


<body>


<header>

    <h1 id="sectionTitle">المناعة</h1>

    <p>
        اختر المحتوى الذي تريد الوصول إليه
    </p>

</header>


<section class="sections">


    <!-- الملخصات -->

    <a href="#" id="summaryLink" class="section-card">

        <div class="section-icon">
            📚
        </div>

        <h2>
            الملخصات
        </h2>

        <p>
            ملخصات ودروس المحور
        </p>

    </a>


    <!-- التمارين -->

    <a href="#" id="exercisesLink" class="section-card">

        <div class="section-icon">
            📝
        </div>

        <h2>
            التمارين
        </h2>

        <p>
            تمارين وتطبيقات للتدرب
        </p>

    </a>


</section>


<a href="immunity.html" class="back-button">
    ← العودة إلى المناعة
</a>


<script>

const params =
    new URLSearchParams(window.location.search);

const topic =
    params.get("topic");


const topics = {

    identity: "الذات واللاذات",

    humoral: "المناعة الخلطية والخلوية"

};


if (topics[topic]) {

    document.getElementById("sectionTitle").textContent =
        topics[topic];

}


/* الذات واللاذات */

if (topic === "identity") {

    document.getElementById("summaryLink").href =
        "#";

    document.getElementById("exercisesLink").href =
        "#";

}


/* المناعة الخلطية والخلوية */

if (topic === "humoral") {

    document.getElementById("summaryLink").href =
        "#";

    document.getElementById("exercisesLink").href =
        "#";

}

</script>


</body>

</html>
