<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>بكالوريات علوم تجريبية | Science with Prof Marwa</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #08080d;
            color: white;
            min-height: 100vh;
        }

        .bac-page {
            padding: 45px 20px;
            max-width: 1100px;
            margin: auto;
        }

        .title {
            text-align: center;
            margin-bottom: 45px;
        }

        .title .icon {
            font-size: 55px;
            color: #b66cff;
            text-shadow: 0 0 20px #b66cff;
            margin-bottom: 15px;
        }

        .title h1 {
            font-size: 38px;
            margin-bottom: 10px;
        }

        .title p {
            color: #cfcfcf;
            font-size: 18px;
        }

        .years-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 22px;
        }

        .year-card {
            text-decoration: none;
            color: white;
            background: #11111a;
            border: 1px solid #8d4dff;
            border-radius: 20px;
            padding: 30px 15px;
            text-align: center;
            font-size: 28px;
            font-weight: bold;

            box-shadow:
                0 0 12px rgba(141, 77, 255, 0.25);

            transition: 0.3s;
        }

        .year-card i {
            display: block;
            font-size: 25px;
            color: #d98cff;
            margin-bottom: 12px;
        }

        .year-card:hover {
            transform: translateY(-6px);
            border-color: #ff72d2;

            box-shadow:
                0 0 25px rgba(255, 114, 210, 0.5);
        }

        .back-buttons {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-top: 45px;
            flex-wrap: wrap;
        }

        .back-buttons a {
            text-decoration: none;
            color: white;
            padding: 14px 25px;
            border-radius: 30px;
            background: linear-gradient(135deg, #8d4dff, #d94cff);
            font-weight: bold;
            transition: 0.3s;
        }

        .back-buttons a:hover {
            transform: translateY(-3px);
            box-shadow: 0 0 20px rgba(217, 76, 255, 0.5);
        }

        @media (max-width: 700px) {
            .years-grid {
                grid-template-columns: repeat(2, 1fr);
                gap: 15px;
            }

            .title h1 {
                font-size: 30px;
            }

            .year-card {
                font-size: 24px;
                padding: 25px 10px;
            }
        }
    </style>
</head>
