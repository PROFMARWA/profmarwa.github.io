<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Science with Prof Marwa</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#f8f5ff;
}

.hero{
height:100vh;
background:linear-gradient(rgba(40,0,80,.6),rgba(40,0,80,.6)),
url("https://images.unsplash.com/photo-1532187643603-ba119ca4109e");
background-size:cover;
background-position:center;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
color:white;
padding:20px;
}

.hero-content h1{
font-size:55px;
margin-bottom:15px;
}

.hero-content p{
font-size:24px;
margin-bottom:30px;
}

.start-btn{
display:inline-block;
padding:18px 45px;
background:linear-gradient(45deg,#ff4fc3,#9d4dff);
color:white;
text-decoration:none;
font-size:24px;
border-radius:50px;
font-weight:bold;
}

.social-card{
margin-top:25px;
display:inline-block;
padding:18px 40px;
border-radius:50px;
background:#28a8ea;
color:white;
font-size:22px;
font-weight:bold;
text-decoration:none;
}

.cards{
padding:60px 20px;
display:none;
grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
gap:25px;
max-width:1200px;
margin:auto;
}

.card{
background:white;
padding:30px;
border-radius:20px;
box-shadow:0 5px 15px rgba(0,0,0,.1);
text-align:center;
}

.card h2{
color:#8e44ad;
margin-bottom:15px;
}

.card a{
display:inline-block;
margin-top:15px;
padding:12px 25px;
background:linear-gradient(45deg,#ff4fc3,#9d4dff);
color:white;
text-decoration:none;
border-radius:30px;
}

</style>
</head>

<body>

<section class="hero">

<div class="hero-content">

<h1>Science with Prof Marwa</h1>

<p>علوم الطبيعة والحياة</p>

<a href="#" class="start-btn" onclick="showCards()">
📖 ابدأ الآن
</a>

<br>

<a id="socialCard" class="social-card"
href="https://t.me/sciencesmarwa">
✈️ زرنا على تيليجرام
</a>

</div>

</section>

<section class="cards" id="cards">

<div class="card">
<h2>📝 الفروض والاختبارات</h2>
<p>فروض واختبارات مع التصحيح النموذجي</p>
<a href="#">استكشف</a>
</div>

<div class="card">
<h2>🎓 البكالوريا</h2>
<p>مواضيع البكالوريا السابقة مع الحلول</p>
<a href="#">استكشف</a>
</div>

<div class="card">
<h2>📊 حساب المعدل</h2>
<p>حساب المعدل والمعدل الموزون</p>
<a href="moyenne.html">استكشف</a>
</div>

</section>

<script>

function showCards(){
document.getElementById("cards").style.display="grid";
window.scrollTo({
top:document.getElementById("cards").offsetTop,
behavior:"smooth"
});
}

const socialCard=document.getElementById("socialCard");

const socials=[
{
text:"✈️ زرنا على تيليجرام",
link:"https://t.me/sciencesmarwa",
color:"#28a8ea"
},
{
text:"📘 زرنا على فايسبوك",
link:"https://www.facebook.com/share/19A5CzdY4t/",
color:"#1877f2"
},
{
text:"📷 زرنا على انستغرام",
link:"https://www.instagram.com/prof_marwa_sciences?igsh=MjF1ODc3YWRwMmc5",
color:"#e1306c"
}
];

let current=0;

setInterval(()=>{
current=(current+1)%socials.length;

socialCard.innerHTML=socials[current].text;
socialCard.href=socials[current].link;
socialCard.style.background=socials[current].color;

},3000);

</script>

</body>
</html>
