<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بكالوريا تجريبية | علوم الطبيعة والحياة</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #12052d, #2b0752, #4b0b68);
    color: white;
    min-height: 100vh;
}

header {
    text-align: center;
    padding: 25px 15px 18px;
}

header h1 {
    margin: 0;
    font-size: 26px;
    color: #ff4db8;
}

header p {
    margin-top: 8px;
    color: #ddd;
}

.pdf-container {
    width: 95%;
    max-width: 1000px;
    margin: 10px auto 30px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,77,184,0.35);
    border-radius: 18px;
    padding: 10px;
    box-shadow: 0 0 25px rgba(255,77,184,0.12);
}

iframe {
    width: 100%;
    height: 75vh;
    min-height: 600px;
    border: none;
    border-radius: 12px;
    background: white;
}

.back-button {
    display: block;
    width: fit-content;
    margin: 0 auto 30px;
    padding: 10px 20px;
    border-radius: 25px;
    text-decoration: none;
    color: white;
    font-weight: bold;
    background: linear-gradient(90deg, #8e21e8, #ff35ad);
}

@media (max-width: 600px) {
    header h1 {
        font-size: 22px;
    }

    iframe {
        height: 70vh;
        min-height: 500px;
    }
}
</style>
</head>

<body>

<header>
    <h1>بكالوريا تجريبية</h1>
    <p>علوم الطبيعة والحياة</p>
</header>

<div class="pdf-container">

  <iframe
    
    src="bac_blanc_science.pdf">
</iframe>

</div>

<a href="science.html" class="back-button">
    ← العودة إلى علوم الطبيعة والحياة
</a>

</html>
