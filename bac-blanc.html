<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>بكالوريا تجريبية | علوم الطبيعة والحياة</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(135deg, #12052d, #2b0752, #4b0b68);
    color: white;
    min-height: 100vh;
}

header {
    text-align: center;
    padding: 25px 15px 18px;
}

header h1 {
    margin: 0;
    font-size: 26px;
    color: #ff4db8;
}

header p {
    margin-top: 8px;
    color: #ddd;
}

.pdf-container {
    width: 95%;
    max-width: 1000px;
    margin: 10px auto 30px;
    padding: 10px;
    background: rgba(255,255,255,0.08);
    border: 1px solid rgba(255,77,184,0.35);
    border-radius: 18px;
    box-shadow: 0 0 25px rgba(255,77,184,0.12);
}

.pdf-page {
    display: block;
    width: 100%;
    height: auto;
    margin: 0 auto 15px;
    background: white;
    border-radius: 8px;
    box-shadow: 0 0 12px rgba(0,0,0,0.3);
}

.page-loading {
    min-height: 400px;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #ddd;
    font-size: 16px;
    background: rgba(255,255,255,0.04);
    border-radius: 10px;
    margin-bottom: 15px;
}

.loading {
    text-align: center;
    padding: 40px 10px;
    color: #ddd;
    font-size: 17px;
}

.back-button {
    display: block;
    width: fit-content;
    margin: 0 auto 30px;
    padding: 10px 20px;
    border-radius: 25px;
    text-decoration: none;
    color: white;
    font-weight: bold;
    background: linear-gradient(90deg, #8e21e8, #ff35ad);
}

@media (max-width: 600px) {

    header h1 {
        font-size: 22px;
    }

    .page-loading {
        min-height: 350px;
    }
}
</style>

</head>

<body>

<header>
    <h1>بكالوريا تجريبية</h1>
    <p>علوم الطبيعة والحياة</p>
</header>

<div class="pdf-container">

    <div id="loading" class="loading">
        جارٍ تحميل الموضوع...
    </div>

    <div id="pdf-pages"></div>

</div>

<a href="science.html" class="back-button">
    ← العودة إلى علوم الطبيعة والحياة
</a>


<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>

<script>

pdfjsLib.GlobalWorkerOptions.workerSrc =
"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js";

const pdfUrl = "bac_blanc_science.pdf";

const pagesContainer = document.getElementById("pdf-pages");
const loading = document.getElementById("loading");

let pdfDocument = null;


/* تحميل صفحة واحدة */

function renderPage(pageNumber, container) {

    if (container.dataset.loaded === "true") {
        return;
    }

    container.dataset.loaded = "true";

    container.textContent =
        "جارٍ تحميل الصفحة " + pageNumber + "...";

    pdfDocument.getPage(pageNumber).then(function(page) {

        const viewport = page.getViewport({
            scale: 1.4
        });

        const canvas = document.createElement("canvas");
        const context = canvas.getContext("2d");

        canvas.className = "pdf-page";

        canvas.width = viewport.width;
        canvas.height = viewport.height;

        container.innerHTML = "";
        container.appendChild(canvas);

        page.render({
            canvasContext: context,
            viewport: viewport
        });

    }).catch(function() {

        container.textContent =
            "تعذر تحميل هذه الصفحة.";

    });

}


/* تحميل ملف PDF */

pdfjsLib.getDocument({
    url: pdfUrl,
    disableAutoFetch: false,
    disableStream: false
}).promise.then(function(pdf) {

    pdfDocument = pdf;

    loading.style.display = "none";


    /* إنشاء أماكن الصفحات */

    for (let i = 1; i <= pdf.numPages; i++) {

        const pageContainer = document.createElement("div");

        pageContainer.className = "page-loading";

        pageContainer.textContent =
            "الصفحة " + i + " — جارٍ تجهيزها...";

        pageContainer.dataset.page = i;

        pagesContainer.appendChild(pageContainer);

    }


    /* تحميل الصفحات تدريجيًا */

    const observer = new IntersectionObserver(function(entries) {

        entries.forEach(function(entry) {

            if (entry.isIntersecting) {

                const container = entry.target;

                const pageNumber =
                    Number(container.dataset.page);

                renderPage(pageNumber, container);

                observer.unobserve(container);

            }

        });

    }, {
        rootMargin: "500px 0px"
    });


    document
        .querySelectorAll(".page-loading")
        .forEach(function(container) {

            observer.observe(container);

        });


}).catch(function(error) {

    loading.textContent =
        "تعذر تحميل الموضوع. تأكد من وجود ملف bac_blanc_science.pdf.";

    console.error(error);

});

</script>

</body>
</html>
