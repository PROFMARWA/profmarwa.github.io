<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>القسم | Science with Prof Marwa</title>

<style>

* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {

    margin: 0;

    font-family: Arial, Tahoma, sans-serif;

    background:
        linear-gradient(
            135deg,
            #12052d,
            #2b0752,
            #4b0b68
        );

    color: white;

    min-height: 100vh;
}


/* ================================
   الصفحة
================================ */

.section-page {

    min-height: 100vh;

    padding: 25px 15px 40px;

}


/* ================================
   العنوان
================================ */

.section-header {

    text-align: center;

    padding: 10px 10px 25px;

}


.section-header h1 {

    margin: 0;

    font-size: clamp(25px, 6vw, 38px);

    font-weight: 900;

    color: #ff4db8;

}


.section-header p {

    margin-top: 10px;

    color: #ddd;

    font-size: 17px;

}


/* ================================
   الحاوية الرئيسية
   نفس شكل صفحة البكالوريات
================================ */

.content-container {

    width: 95%;

    max-width: 1000px;

    margin: 10px auto 30px;

    padding: 18px;

    background:
        rgba(255,255,255,0.08);

    border:
        1px solid rgba(255,77,184,0.35);

    border-radius: 18px;

    box-shadow:
        0 0 25px rgba(255,77,184,0.12);

}


/* ================================
   المواضيع
================================ */

.topics {

    display: grid;

    grid-template-columns:
        repeat(2, 1fr);

    gap: 18px;

}


/* ================================
   بطاقة الموضوع
================================ */

.topic-card {

    position: relative;

    min-height: 190px;

    padding: 25px 18px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    text-align: center;

    text-decoration: none;

    color: white;

    background:

        linear-gradient(
            145deg,
            rgba(91,22,119,0.95),
            rgba(42,8,62,0.98)
        );

    border:
        1px solid rgba(255,77,184,0.35);

    border-radius: 15px;

    box-shadow:
        0 8px 25px rgba(0,0,0,0.25);

    overflow: hidden;

    transition:
        transform .3s ease,
        box-shadow .3s ease,
        border-color .3s ease;

}


/* الخط العلوي */

.topic-card::before {

    content: "";

    position: absolute;

    top: 0;
    right: 0;

    width: 100%;

    height: 4px;

    background:

        linear-gradient(
            90deg,
            #8e21e8,
            #ff35ad
        );

}


/* تأثير الإضاءة */

.topic-card::after {

    content: "";

    position: absolute;

    width: 150px;

    height: 150px;

    top: -80px;

    left: -50px;

    border-radius: 50%;

    background:
        rgba(255,77,184,0.12);

    pointer-events: none;

}


/* الحركة */

.topic-card:hover {

    transform:
        translateY(-6px);

    border-color:
        rgba(255,77,184,0.75);

    box-shadow:

        0 15px 35px rgba(0,0,0,0.4),

        0 0 25px rgba(255,77,184,0.18);

}


/* ================================
   الأيقونة
================================ */

.topic-icon {

    width: 65px;

    height: 65px;

    margin-bottom: 14px;

    display: flex;

    align-items: center;

    justify-content: center;

    border-radius: 18px;

    font-size: 30px;

    background:

        linear-gradient(
            135deg,
            #8e21e8,
            #ff35ad
        );

    box-shadow:

        0 0 20px
        rgba(255,77,184,0.30);

}


/* ================================
   عنوان الموضوع
================================ */

.topic-card h2 {

    margin: 0 0 8px;

    font-size: 22px;

    font-weight: 900;

    color: #ff65c1;

}


/* ================================
   وصف الموضوع
================================ */

.topic-card p {

    margin: 0;

    color: #ddd;

    font-size: 14px;

    line-height: 1.7;

}


/* ================================
   زر العودة
================================ */

.back-button {

    display: block;

    width: fit-content;

    margin: 0 auto 18px;

    padding: 11px 22px;

    border-radius: 25px;

    text-decoration: none;

    color: white;

    font-weight: bold;

    background:

        linear-gradient(
            90deg,
            #8e21e8,
            #ff35ad
        );

    box-shadow:

        0 6px 20px
        rgba(255,53,173,0.20);

    transition: .3s ease;

}


.back-button:hover {

    transform:
        translateY(-3px);

}


/* ================================
   الهاتف
================================ */

@media (max-width: 600px) {

    .section-page {

        padding:
            20px 8px 30px;

    }

    .section-header h1 {

        font-size: 25px;

    }

    .section-header p {

        font-size: 15px;

    }

    .content-container {

        width: 96%;

        padding: 10px;

        border-radius: 18px;

    }

    .topics {

        grid-template-columns:
            repeat(2, 1fr);

        gap: 10px;

    }

    .topic-card {

        min-height: 170px;

        padding:
            18px 7px;

        border-radius: 13px;

    }

    .topic-icon {

        width: 53px;

        height: 53px;

        margin-bottom: 10px;

        border-radius: 15px;

        font-size: 24px;

    }

    .topic-card h2 {

        font-size: 16px;

        line-height: 1.5;

    }

    .topic-card p {

        font-size: 11px;

        line-height: 1.5;

    }

    .back-button {

        font-size: 14px;

        padding:
            10px 18px;

    }

}

</style>

</head>


<body>


<main class="section-page">


<!-- ================================
     العنوان
================================ -->

<header class="section-header">

    <h1 id="sectionTitle">
        القسم
    </h1>

    <p>
        علوم الطبيعة والحياة
    </p>

</header>



<!-- ================================
     الحاوية
================================ -->

<div class="content-container">


<section class="topics">


<!-- ================================
     الملخصات
================================ -->

<a href="#"
   id="summaryLink"
   class="topic-card">

    <div class="topic-icon">
        📚
    </div>

    <h2>
        الملخصات
    </h2>

    <p>
        ملخصات ودروس القسم
    </p>

</a>



<!-- ================================
     التمارين
================================ -->

<a href="protein-exercises.pdf"
   id="exercisesLink"
   class="topic-card">

    <div class="topic-icon">
        📝
    </div>

    <h2>
        التمارين
    </h2>

    <p>
        تمارين وتطبيقات للتدرب
    </p>

</a>



<!-- ================================
     المخططات
================================ -->

<a href="#"
   id="schemesLink"
   class="topic-card">

    <div class="topic-icon">
        📖
    </div>

    <h2>
        المخططات
    </h2>

    <p>
        مخططات توضيحية تساعد على فهم الدرس واسترجاع المعلومات
    </p>

</a>


</section>

</div>



<!-- ================================
     أزرار العودة
================================ -->

<a href="science.html"
   class="back-button">

    ← العودة إلى علوم الطبيعة والحياة

</a>


<a href="index.html"
   class="back-button">

    ← العودة للرئيسية

</a>


</main>



<script>

/* ==========================================
   تحديد القسم من الرابط
========================================== */

const params =
    new URLSearchParams(
        window.location.search
    );

const subject =
    params.get("subject");



/* ==========================================
   أسماء الأقسام
========================================== */

const subjects = {

    prerequisites:
        "المكتسبات القبلية",

    protein:
        "تركيب البروتين",

    structure:
        "العلاقة بين بنية ووظيفة البروتين",

    enzymes:
        "الإنزيمات",

    immunity:
        "المناعة",

    nervous:
        "الاتصال العصبي",

    photosynthesis:
        "التركيب الضوئي",

    respiration:
        "التنفس",

    geology:
        "الجيولوجيا"

};



/* ==========================================
   تغيير العنوان
========================================== */

if (subjects[subject]) {

    document
        .getElementById("sectionTitle")
        .textContent =
        subjects[subject];

}



/* ==========================================
   روابط الملخصات
========================================== */

const summaryLink =
    document.getElementById(
        "summaryLink"
    );


if (subject === "protein") {

    summaryLink.href =
        "protein-summary.pdf";

}


if (subject === "structure") {

    summaryLink.href =
        "structure-summary.pdf";

}


if (subject === "enzymes") {

    summaryLink.href =
        "enzymes-summary.pdf";

}


if (subject === "immunity") {

    summaryLink.href =
        "humoral-summary.pdf";

}


/* ==========================================
   رابط التمارين
========================================== */

const exercisesLink =
    document.getElementById(
        "exercisesLink"
    );


if (subject === "protein") {

    exercisesLink.href =
        "protein-exercises.pdf";

}


/* ==========================================
   المخططات
========================================== */

const schemesLink =
    document.getElementById(
        "schemesLink"
    );


</script>


</body>

</html>
