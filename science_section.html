
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>القسم | Science with Prof Marwa</title>

<style>
*{margin:0;padding:0;box-sizing:border-box}
html{scroll-behavior:smooth}
body{font-family:Arial,Tahoma,sans-serif;background:#16051f;color:white}
.section-page{
min-height:100vh;padding:45px 5% 70px;position:relative;overflow:hidden;
background:radial-gradient(circle at 15% 10%,rgba(255,55,190,.32),transparent 28%),
radial-gradient(circle at 88% 20%,rgba(80,255,170,.22),transparent 27%),
radial-gradient(circle at 50% 100%,rgba(145,40,220,.34),transparent 38%),
linear-gradient(135deg,#16051f,#2b0644,#3c0755,#180622)
}
.section-header{position:relative;z-index:2;text-align:center;margin-bottom:40px}
.section-header h1{
font-size:clamp(32px,6vw,55px);font-weight:900;line-height:1.4;
background:linear-gradient(90deg,#ff42b7,#c84cff,#58ffad,#ff42b7);
background-size:300% 100%;-webkit-background-clip:text;background-clip:text;
-webkit-text-fill-color:transparent;animation:titleGlow 5s ease infinite
}
@keyframes titleGlow{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.section-header p{margin-top:12px;color:#f5dff5;font-size:18px;font-weight:600}
.section-grid{position:relative;z-index:2;width:100%;max-width:900px;margin:auto;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px}
.section-card{
position:relative;min-height:220px;padding:25px 15px;display:flex;flex-direction:column;
align-items:center;justify-content:center;text-align:center;text-decoration:none;color:white;
border-radius:25px;overflow:hidden;background:linear-gradient(145deg,rgba(91,22,119,.95),rgba(42,8,62,.98));
border:2px solid #087a4c;box-shadow:0 12px 35px #0006,0 0 30px #1edc8726;transition:.3s
}
.section-card::before{content:"";position:absolute;top:0;left:0;width:100%;height:5px;background:linear-gradient(90deg,#ff32b4,#b944ff,#26df8a,#ff32b4);background-size:250% 100%;animation:borderGlow 4s linear infinite}
@keyframes borderGlow{to{background-position:250% 50%}}
.section-card:hover{transform:translateY(-7px);border-color:#55ffad;box-shadow:0 20px 45px #0007,0 0 35px #23f09140}
.section-icon{position:relative;z-index:1;width:68px;height:68px;margin-bottom:15px;display:flex;align-items:center;justify-content:center;border-radius:20px;font-size:32px;background:linear-gradient(135deg,#ff35b3,#a93ee8,#5affad)}
.section-card h2{position:relative;z-index:1;margin-bottom:10px;font-size:25px;font-weight:900;background:linear-gradient(90deg,#64ffad,#ff55bd,#c45aff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.section-card p{position:relative;z-index:1;color:#ead8ed;font-size:15px;line-height:1.7}
.section-home{position:relative;z-index:2;display:block;width:min(280px,100%);margin:25px auto 0;padding:15px;text-align:center;text-decoration:none;color:white;font-size:17px;font-weight:900;border-radius:18px;background:linear-gradient(90deg,#ff32b0,#8d35d0,#18ad6b);box-shadow:0 8px 25px #ff2daf40;transition:.3s}
.section-home:hover{transform:translateY(-4px)}
@media(max-width:600px){
.section-page{padding:30px 12px 45px}
.section-header{margin-bottom:28px}
.section-header h1{font-size:29px}
.section-header p{font-size:14px}
.section-grid{gap:11px}
.section-card{min-height:185px;padding:17px 7px;border-radius:18px}
.section-icon{width:53px;height:53px;font-size:25px;margin-bottom:10px}
.section-card h2{font-size:17px;line-height:1.5}
.section-card p{font-size:11px}
}
</style>
</head>

<body>
<main class="section-page">
<header class="section-header">
<h1 id="sectionTitle">القسم</h1>
<p>اختر ما تريد البدء فيه</p>
</header>

<section class="section-grid">
<a href="#" id="summaryLink" class="section-card">
<div class="section-icon">📚</div>
<h2>الملخصات</h2>
<p>ملخصات ودروس القسم</p>
</a>

<a href="#" id="exercisesLink" class="section-card">
<div class="section-icon">📝</div>
<h2>التمارين</h2>
<p>تمارين وتطبيقات للتدرب</p>
</a>

<a href="#" id="diagramsLink" class="section-card">
<div class="section-icon">🗺️</div>
<h2>المخططات</h2>
<p>مخططات توضيحية تساعد على فهم الدرس واسترجاع المعلومات</p>
</a>
</section>

<a href="science.html" class="section-home">← العودة إلى علوم الطبيعة والحياة</a>

</main>

<script>
/* ==========================================
   بيانات الدروس والملفات
   أضف الملفات الجديدة هنا فقط
   ========================================== */

const lessons = {
prerequisites: {
title:"المكتسبات القبلية", summary:"", exercises:"", diagrams:""
},
protein: {
title:"تركيب البروتين",
summary:"protein-summary.pdf",
exercises:"protein-exercises.pdf",
diagrams:""
},
structure: {
title:"العلاقة بين بنية ووظيفة البروتين",
summary:"structure-summary.pdf", exercises:"", diagrams:""
},
enzymes: {
title:"الإنزيمات",
summary:"enzymes-summary.pdf", exercises:"", diagrams:""
},
immunity: {
title:"المناعة",
summary:"humoral-summary.pdf", exercises:"", diagrams:""
},
nervous: {
title:"الاتصال العصبي",
summary:"nervous-summary.pdf", exercises:"", diagrams:""
},
photosynthesis: {
title:"التركيب الضوئي",
summary:"photosynthesis-summary.pdf", exercises:"", diagrams:""
},
respiration: {
title:"التنفس", summary:"", exercises:"", diagrams:""
},
geology: {
title:"الجيولوجيا",
summary:"", exercises:"", diagrams:""
}
};

const params = new URLSearchParams(location.search);
const subject = params.get("subject");
const lesson = lessons[subject];

if (lesson) {
document.getElementById("sectionTitle").textContent = lesson.title;

function configureLink(id, filename, type) {
const element = document.getElementById(id);

if (filename) {
element.href = "pdf-viewer.html?file=" +
encodeURIComponent(filename) +
"&subject=" + encodeURIComponent(subject) +
"&type=" + encodeURIComponent(type);
} else {
element.href = "#";
element.addEventListener("click", function(event) {
event.preventDefault();
alert("لم تتم إضافة هذا الملف بعد.");
});
}
}

configureLink("summaryLink", lesson.summary, "summary");
configureLink("exercisesLink", lesson.exercises, "exercises");
configureLink("diagramsLink", lesson.diagrams, "diagrams");

} else {
document.getElementById("sectionTitle").textContent = "القسم";
}
</script>
</body>
</html>
