<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>عرض الملف</title>

<style>

* {
    box-sizing: border-box;
}

body {

    margin: 0;

    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            #12052d,
            #2b0752,
            #4b0b68
        );

    color: white;

    min-height: 100vh;
}


/* العنوان */

header {

    text-align: center;

    padding: 25px 15px 18px;
}

header h1 {

    margin: 0;

    font-size: 25px;

    color: #ff4db8;

    text-shadow:
        0 0 12px rgba(255,77,184,0.5);
}


/* حاوية PDF */

.pdf-container {

    width: 95%;

    max-width: 1000px;

    margin: 10px auto 30px;

    padding: 0 10px 10px;

    background:
        rgba(255,255,255,0.08);

    border:
        1px solid rgba(255,77,184,0.35);

    border-radius: 18px;

    box-shadow:
        0 0 25px rgba(255,77,184,0.12);

    overflow: hidden;

    position: relative;
}


/* شاشة التحميل */

.loading-screen {

    min-height: 300px;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    gap: 15px;

    color: #ddd;

    text-align: center;

    font-size: 17px;
}


/* دائرة التحميل */

.spinner {

    width: 42px;

    height: 42px;

    border: 4px solid rgba(255,255,255,0.2);

    border-top:
        4px solid #ff4db8;

    border-radius: 50%;

    animation:
        spin 0.8s linear infinite;
}


@keyframes spin {

    to {
        transform: rotate(360deg);
    }

}


/* عارض PDF */

.pdf-frame {

    width: 100%;

    height:
        calc(80vh + 72px);

    margin-top:
        -60px;

    border: none;

    display: block;

    border-radius: 10px;

    background: white;

    opacity: 0;

    transition:
        opacity 0.35s ease;
}


/* بعد ظهور العارض */

.pdf-frame.loaded {

    opacity: 1;
}


/* زر العودة */

.back-button {

    display: block;

    width: fit-content;

    margin: 0 auto 30px;

    padding: 10px 20px;

    border-radius: 25px;

    text-decoration: none;

    color: white;

    font-weight: bold;

    background:
        linear-gradient(
            90deg,
            #8e21e8,
            #ff35ad
        );

    box-shadow:
        0 0 15px rgba(255,53,173,0.2);
}


/* الهاتف */

@media (max-width: 600px) {

    header h1 {

        font-size: 22px;
    }

    .pdf-frame {

        height:
            calc(80vh + 72px);

        margin-top:
            -60px;
    }

}

</style>

</head>


<body>


<header>

    <h1 id="fileTitle">
        جارٍ تحميل الملف...
    </h1>

</header>


<div class="pdf-container">


    <div id="loadingScreen"
         class="loading-screen">

        <div class="spinner"></div>

        <div>
            📚 جاري تجهيز الملف...
        </div>

        <div style="
            font-size:14px;
            color:#aaa;
        ">
            لحظات وسيظهر الملخص
        </div>

    </div>


    <iframe
        id="pdfFrame"
        class="pdf-frame"
        loading="eager"
        allow="fullscreen">
    </iframe>


</div>


<a href="science_section.html"
   class="back-button">

    ← العودة

</a>


<script>


/* قراءة اسم الملف من الرابط */

const params =
    new URLSearchParams(
        window.location.search
    );


const file =
    params.get("file");


const fileTitle =
    document.getElementById(
        "fileTitle"
    );


const pdfFrame =
    document.getElementById(
        "pdfFrame"
    );


const loadingScreen =
    document.getElementById(
        "loadingScreen"
    );


/* أسماء الملفات */

const titles = {

    "protein-summary":
        "ملخصات تركيب البروتين",

    "structure-summary":
        "ملخصات العلاقة بين بنية ووظيفة البروتين",

    "enzymes-summary":
        "ملخصات الإنزيمات",

    "humoral-summary":
        "ملخصات المناعة الخلطية والخلوية",

    "nervous-summary":
        "ملخصات الاتصال العصبي",

    "photosynthesis-summary":
        "ملخصات التركيب الضوئي"

};


/* إذا لم يتم تحديد ملف */

if (!file) {

    fileTitle.textContent =
        "عرض الملف";

    loadingScreen.innerHTML =
        "لم يتم تحديد الملف.";

}


/* إذا تم تحديد الملف */

if (file) {

    const cleanName =
        file.replace(".pdf", "");


    fileTitle.textContent =
        titles[cleanName] ||
        "عرض الملف";


    /*
       تحويل اسم الملف إلى
       رابط كامل من موقعك
    */

    const pdfUrl =
        new URL(
            file,
            window.location.href
        ).href;


    /*
       فتح PDF.js
       مع الرابط الكامل الصحيح
    */

    const viewerUrl =
        "https://mozilla.github.io/pdf.js/web/viewer.html?file="
        +
        encodeURIComponent(pdfUrl);


    pdfFrame.src =
        viewerUrl;


    /*
       عند تحميل العارض
    */

    pdfFrame.addEventListener(
        "load",
        function() {

            setTimeout(
                function() {

                    pdfFrame.classList.add(
                        "loaded"
                    );

                    loadingScreen.style.display =
                        "none";

                },
                500
            );

        }
    );

}

</script>


</body>

</html>
