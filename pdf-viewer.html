
<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>عرض الملف | Science with Prof Marwa</title>

<style>
*{box-sizing:border-box}
body{
    margin:0;
    font-family:Arial,Tahoma,sans-serif;
    background:linear-gradient(135deg,#12052d,#2b0752,#4b0b68);
    color:white;
    min-height:100vh;
}
header{text-align:center;padding:24px 12px 14px}
header h1{
    margin:0;
    font-size:clamp(21px,4vw,30px);
    color:#ff4db8;
    text-shadow:0 0 12px #ff4db880;
}
.file-type{margin-top:10px;color:#ead8ed;font-size:14px}
.actions{
    display:flex;
    flex-wrap:wrap;
    justify-content:center;
    gap:12px;
    padding:12px;
}
.action-button{
    display:inline-block;
    padding:12px 20px;
    border-radius:16px;
    text-decoration:none;
    color:white;
    font-weight:bold;
    background:linear-gradient(90deg,#8e21e8,#ff35ad);
    box-shadow:0 0 15px #ff35ad30;
    border:0;
    cursor:pointer;
    font-size:15px;
}
.action-button.secondary{
    background:linear-gradient(90deg,#087a4c,#18ad6b);
}
.pdf-container{
    width:95%;
    max-width:1000px;
    margin:10px auto 30px;
    padding:10px;
    background:#ffffff14;
    border:1px solid #ff4db859;
    border-radius:18px;
    box-shadow:0 0 25px #ff4db81f;
}
.pdf-frame{
    width:100%;
    height:75vh;
    min-height:450px;
    border:0;
    border-radius:10px;
    background:white;
}
.notice{
    text-align:center;
    padding:12px;
    color:#f5dff5;
    font-size:14px;
    line-height:1.8;
}
@media(max-width:600px){
    header{padding-top:20px}
    .pdf-container{width:97%;padding:5px}
    .pdf-frame{height:70vh;min-height:400px}
    .action-button{padding:11px 14px;font-size:14px}
}
</style>
</head>

<body>
<header>
    <h1 id="fileTitle">عرض الملف</h1>
    <div class="file-type" id="fileDescription">Science with Prof Marwa</div>
</header>

<div class="actions">
    <a id="downloadButton" class="action-button" href="#" download>
        📥 تحميل الملف
    </a>
    <a id="backButton" class="action-button secondary" href="science.html">
        ← العودة إلى القسم
    </a>
</div>

<div class="pdf-container">
    <iframe id="pdfFrame" class="pdf-frame" title="عارض ملف PDF"></iframe>
    <div class="notice">
        إذا لم يظهر الملف داخل الصفحة، اضغط على «تحميل الملف» لفتحه على جهازك.
    </div>
</div>

<script>
const params = new URLSearchParams(location.search);
const file = params.get("file");
const subject = params.get("subject") || "";
const type = params.get("type") || "summary";

const titles = {
    "protein-summary.pdf":"ملخصات تركيب البروتين",
    "protein-exercises.pdf":"تمارين تركيب البروتين",
    "structure-summary.pdf":"ملخصات العلاقة بين بنية ووظيفة البروتين",
    "enzymes-summary.pdf":"ملخصات الإنزيمات",
    "humoral-summary.pdf":"ملخصات المناعة الخلطية والخلوية",
    "nervous-summary.pdf":"ملخصات الاتصال العصبي",
    "photosynthesis-summary.pdf":"ملخصات التركيب الضوئي"
};

const subjectNames = {
    prerequisites:"المكتسبات القبلية",
    protein:"تركيب البروتين",
    structure:"العلاقة بين بنية ووظيفة البروتين",
    enzymes:"الإنزيمات",
    immunity:"المناعة",
    nervous:"الاتصال العصبي",
    photosynthesis:"التركيب الضوئي",
    respiration:"التنفس",
    geology:"الجيولوجيا"
};

const typeNames = {
    summary:"الملخصات",
    exercises:"التمارين",
    diagrams:"المخططات"
};

const titleElement = document.getElementById("fileTitle");
const descriptionElement = document.getElementById("fileDescription");
const frame = document.getElementById("pdfFrame");
const downloadButton = document.getElementById("downloadButton");
const backButton = document.getElementById("backButton");

if (!file || file.includes("/") || file.includes("\\") || file.includes("..")) {
    titleElement.textContent = "لم يتم تحديد ملف صالح";
    descriptionElement.textContent = "ارجع إلى القسم واختر ملفًا.";
    frame.hidden = true;
    downloadButton.hidden = true;
} else {
    const pdfUrl = new URL(file, location.href).href;

    titleElement.textContent = titles[file] || file.replace(/\.pdf$/i, "");
    descriptionElement.textContent =
        (subjectNames[subject] || "القسم") + " — " +
        (typeNames[type] || "الملف");

    downloadButton.href = pdfUrl;
    frame.src =
        "https://mozilla.github.io/pdf.js/web/viewer.html?file=" +
        encodeURIComponent(pdfUrl);
}

backButton.href = subject
    ? "science_section.html?subject=" + encodeURIComponent(subject)
    : "science.html";
</script>
</body>
</html>
