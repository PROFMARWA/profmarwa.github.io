<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عرض الملف</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;

    font-family: Arial, sans-serif;

    background:
        linear-gradient(
            135deg,
            #12052d,
            #2b0752,
            #4b0b68
        );

    color: white;

    min-height: 100vh;
}

header {
    text-align: center;
    padding: 25px 15px 18px;
}

header h1 {
    margin: 0;
    font-size: 25px;
    color: #ff4db8;

    text-shadow:
        0 0 12px rgba(255,77,184,0.5);
}

.pdf-container {
    width: 95%;
    max-width: 1000px;

    margin: 10px auto 30px;

    padding: 0 10px 10px;

    background: rgba(255,255,255,0.08);

    border: 1px solid rgba(255,77,184,0.35);

    border-radius: 18px;

    box-shadow: 0 0 25px rgba(255,77,184,0.12);

    overflow: hidden;
}


.pdf-frame {
    width: 100%;

    height: calc(80vh + 72px);

    margin-top: -72px;

    border: none;

    display: block;

    border-radius: 10px;

    background: white;
}


.back-button {

    display: block;

    width: fit-content;

    margin: 0 auto 30px;

    padding: 10px 20px;

    border-radius: 25px;

    text-decoration: none;

    color: white;

    font-weight: bold;

    background:
        linear-gradient(
            90deg,
            #8e21e8,
            #ff35ad
        );

    box-shadow:
        0 0 15px rgba(255,53,173,0.2);
}

@media (max-width: 600px) {

    header h1 {
        font-size: 22px;
    }

    .pdf-frame {
        height: 78vh;
        min-height: 550px;
    }

}

</style>

</head>


<body>


<header>

    <h1 id="fileTitle">
        جارٍ تحميل الملف...
    </h1>

</header>


<div class="pdf-container">

    <iframe
        id="pdfFrame"
        class="pdf-frame">
    </iframe>

</div>


<a href="science_section.html"
   class="back-button">

    ← العودة

</a>


<script>

const params =
    new URLSearchParams(
        window.location.search
    );

const file =
    params.get("file");

const pdfFrame =
    document.getElementById("pdfFrame");

const fileTitle =
    document.getElementById("fileTitle");


const titles = {

    "protein-summary":
        "ملخصات تركيب البروتين",

    "structure-summary":
        "ملخصات العلاقة بين بنية ووظيفة البروتين",

    "enzymes-summary":
        "ملخصات الإنزيمات",

    "humoral-summary":
        "ملخصات المناعة الخلطية والخلوية",

    "nervous-summary":
        "ملخصات الاتصال العصبي"

};


if (file) {

    const cleanName =
        file.replace(".pdf", "");

    fileTitle.textContent =
        titles[cleanName] ||
        "عرض الملف";


    /*
       استخدام عارض PDF.js الجاهز
       بدل عارض Chrome
    */

    const pdfUrl =
        window.location.origin +
        window.location.pathname
            .replace("pdf-viewer.html", "")
        + file;


    pdfFrame.src =
        "https://mozilla.github.io/pdf.js/web/viewer.html?file="
        + encodeURIComponent(pdfUrl);

}

else {

    fileTitle.textContent =
        "لم يتم تحديد الملف";

}

</script>


</body>

</html>
